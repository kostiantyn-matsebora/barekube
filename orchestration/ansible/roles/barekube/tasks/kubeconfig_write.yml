---
# Adds the cluster to your kubeconfig, or takes it out (barekube_kubeconfig_remove).
# Everything else in the file is left as it is.
- name: Look for your kubeconfig
  ansible.builtin.stat:
    path: "{{ barekube_kubeconfig }}"
  delegate_to: localhost
  become: false
  register: barekube_kubeconfig_file

- name: Read it
  ansible.builtin.slurp:
    src: "{{ barekube_kubeconfig }}"
  delegate_to: localhost
  become: false
  register: barekube_kubeconfig_current
  when: barekube_kubeconfig_file.stat.exists
  no_log: true

- name: Work out the new kubeconfig
  ansible.builtin.set_fact:
    barekube_kubeconfig_new: >-
      {{ (barekube_kubeconfig_current.content | default('e30=') | b64decode | from_yaml or {})
      | combine({
        'apiVersion': 'v1',
        'kind': 'Config',
        'clusters': kept_clusters + added_clusters,
        'users': kept_users + added_users,
        'contexts': kept_contexts + added_contexts,
        'current-context': new_current
      }) }}
  vars:
    existing: "{{ barekube_kubeconfig_current.content | default('e30=') | b64decode | from_yaml or {} }}"
    ours: "{{ barekube_context }}"
    k3s: "{{ (barekube_k3s_kubeconfig.content | b64decode | from_yaml) if not barekube_kubeconfig_remove | bool else {} }}"
    kept_clusters: "{{ (existing.clusters | default([])) | rejectattr('name', 'equalto', ours) | list }}"
    kept_users: "{{ (existing.users | default([])) | rejectattr('name', 'equalto', ours) | list }}"
    kept_contexts: "{{ (existing.contexts | default([])) | rejectattr('name', 'equalto', ours) | list }}"
    added_clusters: >-
      {{ [] if barekube_kubeconfig_remove | bool else
      [{'name': ours, 'cluster': k3s.clusters[0].cluster | combine({'server': barekube_join_endpoint})}] }}
    added_users: "{{ [] if barekube_kubeconfig_remove | bool else [{'name': ours, 'user': k3s.users[0].user}] }}"
    added_contexts: >-
      {{ [] if barekube_kubeconfig_remove | bool else
      [{'name': ours, 'context': {'cluster': ours, 'user': ours}}] }}
    new_current: >-
      {{ '' if (barekube_kubeconfig_remove | bool and existing['current-context'] | default('') == ours)
      else (ours if not barekube_kubeconfig_remove | bool else existing['current-context'] | default('')) }}
  no_log: true
  delegate_to: localhost
  become: false

- name: Make the directory for it
  ansible.builtin.file:
    path: "{{ barekube_kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save it
  ansible.builtin.copy:
    dest: "{{ barekube_kubeconfig }}"
    content: "{{ barekube_kubeconfig_new | to_nice_yaml(indent=2) }}"
    mode: "0600"
    backup: "{{ barekube_kubeconfig_file.stat.exists }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: barekube_kubeconfig_file.stat.exists or not barekube_kubeconfig_remove | bool

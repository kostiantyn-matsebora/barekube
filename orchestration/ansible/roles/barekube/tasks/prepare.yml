---
# Installs the barekube CLI on the node and the packages the cluster needs.

- name: Check the settings
  ansible.builtin.assert:
    that:
      - barekube_disable is sequence and barekube_disable is not string
      - barekube_tls_san is sequence and barekube_tls_san is not string
      - groups['masters'] | default([]) | length > 0
    fail_msg: >-
      barekube_disable and barekube_tls_san must be lists (on the command line:
      -e '{"barekube_disable": ["traefik"]}'), and the inventory needs a masters group.
    quiet: true

- name: Download and verify the release on this machine
  when: barekube_cli_path | length == 0
  run_once: true
  delegate_to: localhost
  vars:
    ansible_become: false
  block:
    - name: Make a work directory
      ansible.builtin.tempfile:
        state: directory
        prefix: barekube.
      register: barekube_work

    - name: Download the release files
      ansible.builtin.get_url:
        url: "{{ barekube_release_url }}/{{ item }}"
        dest: "{{ barekube_work.path }}/{{ item }}"
        mode: "0644"
      loop:
        - barekube
        - SHA256SUMS
        - barekube.sigstore.json

    - name: Check the checksum
      ansible.builtin.command: sha256sum --check --status SHA256SUMS
      args:
        chdir: "{{ barekube_work.path }}"
      changed_when: false

    - name: Check the signature, which must come from the release workflow of this repository
      ansible.builtin.command:
        argv:
          - cosign
          - verify-blob
          - --bundle
          - "{{ barekube_work.path }}/barekube.sigstore.json"
          - --certificate-identity-regexp
          - "{{ barekube_signer_identity }}"
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - "{{ barekube_work.path }}/barekube"
      changed_when: false
      when: barekube_verify_signature | bool

- name: Put the CLI on the node
  ansible.builtin.copy:
    src: "{{ barekube_cli_path if barekube_cli_path | length > 0 else barekube_work.path ~ '/barekube' }}"
    dest: /usr/local/bin/barekube
    owner: root
    group: root
    mode: "0755"

- name: Remove the work directory
  ansible.builtin.file:
    path: "{{ barekube_work.path }}"
    state: absent
  when: barekube_work.path is defined
  run_once: true
  delegate_to: localhost
  vars:
    ansible_become: false

# The CLI checks what is installed and does nothing when it is all there, but it
# does not report whether it changed anything, so these tasks are never "changed".
- name: Install the node dependencies
  ansible.builtin.command: barekube install dependencies
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false

- name: Install the packages Longhorn needs
  ansible.builtin.command: barekube install longhorn-dependencies
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  when: barekube_longhorn | bool

- name: Check the console agent settings
  ansible.builtin.assert:
    that:
      - barekube_console_node_token is string
      - barekube_console_node_token | length >= 16
      - barekube_console_node_token is match('^[A-Za-z0-9._~+/=-]+$')
      - barekube_console_address is match('^https?://[A-Za-z0-9.-]+(:[0-9]+)?$')
      - barekube_console_node_name is match('^[A-Za-z0-9.-]+$')
      - barekube_console_port | int > 0 and barekube_console_port | int < 65536
      - barekube_console_heartbeat_interval is match('^[0-9]+(ms|s|m|h)$')
      - barekube_console_operations is sequence and barekube_console_operations is not string
      - barekube_console_effective_operations | length > 0
      - barekube_console_effective_operations | difference(['reboot', 'standby', 'rejoin', 'poweroff']) | length == 0
      - barekube_console_effective_operations | unique | length == barekube_console_effective_operations | length
      - inventory_hostname in groups['masters'] or 'poweroff' not in barekube_console_effective_operations
    fail_msg: >-
      With barekube_console_agent, set barekube_console_address (http://host:8080). A
      barekube_console_node_token you set has 16 or more characters of A-Z a-z 0-9 . _ ~ + / = -;
      without one, a token is made.
      A node name has only letters, digits, dots and dashes. barekube_console_operations is a list of
      reboot, standby, rejoin and poweroff, and an agent cannot be allowed to poweroff.
    quiet: true
  no_log: true
  when: barekube_console_agent | bool

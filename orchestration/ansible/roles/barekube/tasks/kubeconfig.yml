---
# Puts the cluster in the kubeconfig kubectl reads by default, as the current
# context, next to any clusters you already have.
- name: Read the kubeconfig of the cluster
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: barekube_k3s_kubeconfig
  no_log: true

- name: Merge it into your kubeconfig
  ansible.builtin.include_tasks: kubeconfig_write.yml
  vars:
    barekube_kubeconfig_remove: false

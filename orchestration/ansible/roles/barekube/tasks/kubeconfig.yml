---
- name: Read the kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: barekube_kubeconfig
  no_log: true

- name: Make the directory for it
  ansible.builtin.file:
    path: "{{ barekube_state_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save the kubeconfig, pointing at the cluster instead of this node
  ansible.builtin.copy:
    dest: "{{ barekube_state_dir }}/kubeconfig"
    content: "{{ barekube_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', barekube_join_endpoint) }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

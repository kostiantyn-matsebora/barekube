---
- name: Read the join token
  ansible.builtin.include_tasks: token.yml

- name: Join the cluster as a server
  ansible.builtin.include_tasks: install.yml
  vars:
    barekube_install_argv: >-
      {{ ['barekube', 'install', 'master-node', '--yes', '--server', barekube_join_endpoint]
      + barekube_server_flags }}
    barekube_install_env:
      K3S_TOKEN: "{{ barekube_token.content | b64decode | trim }}"

- name: Wait for the node
  ansible.builtin.include_tasks: wait_ready.yml

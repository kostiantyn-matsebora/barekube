---
# Takes one node out of the cluster: drains it, deletes it from Kubernetes
# (for a master that also removes its etcd member) and uninstalls k3s from it.
# Take the node out of the inventory afterwards.
#
#   ansible-playbook -i inventory.yml remove-node.yml -e barekube_node=agent-2
#
# A machine that is gone for good: add -e barekube_node_unreachable=true to skip
# the drain and the uninstall and only delete it from the cluster.

- name: Check which node to remove
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require the node name
      ansible.builtin.assert:
        that: barekube_node is defined and barekube_node in groups['all']
        fail_msg: Say which node to remove, by its name in the inventory, with -e barekube_node=NAME.
        quiet: true

- name: Remove a node from the cluster
  hosts: "{{ barekube_node | default('none') }}"
  gather_facts: "{{ not (barekube_node_unreachable | default(false) | bool) }}"
  tasks:
    - name: Remove the node
      ansible.builtin.import_role:
        name: barekube
        tasks_from: remove_node

name: CLI tests

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - ".github/workflows/cli-tests.yml"

permissions:
  contents: read

concurrency:
  group: cli-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exits non-zero when any test fails, failing the job (and the PR check).
      - name: Run tests with coverage
        working-directory: cli
        run: tests/run.sh --coverage -v

  release-up-to-date:
    name: Generated release is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pinned version that generated the committed release/barekube.
      - name: Regenerate release/barekube
        working-directory: cli
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/app" \
            dannyben/bashly:1.2.13 generate

      - name: Fail if the committed release differs
        run: git diff --exit-code -- cli/release/barekube

  readme-install:
    name: README installation steps work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs the commands from the README Installation section in a clean HOME,
      # against the release script built from this commit, then checks that
      # barekube is installed and works. The real download and the signature
      # check run after a release is published (see release.yml).
      - name: Run the installation instructions
        run: cli/tests/readme_install.sh local

  # The single required status check for branch protection.
  ci-green:
    name: ci-green
    if: always()
    needs: [test, release-up-to-date, readme-install]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        run: |
          [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.release-up-to-date.result }}" = "success" ] \
            && [ "${{ needs.readme-install.result }}" = "success" ]

name: Release

# Publishes a GitHub release for a version tag: the CLI script, the playbooks,
# the Ansible collection and the console's node-agent binaries, each with a
# SHA-256 checksum, a keyless Sigstore signature and a build provenance
# attestation. After the release it publishes the console's Docker image
# (ghcr.io/kostiantyn-matsebora/barekube-console), multi-architecture, signed and
# attested the same way. It runs only after the unit tests, the console tests
# and the five-node cluster test pass. The
# cluster test is not repeated when an earlier green run covers the same code
# (only documentation or version numbers changed since, see same-code.sh).
# Nothing is signed from a developer machine; the signing identity is this
# workflow at a version tag, which is what `barekube upgrade` verifies.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  tests:
    uses: ./.github/workflows/cli-tests.yml
    permissions:
      contents: read

  console-tests:
    uses: ./.github/workflows/console-tests.yml
    permissions:
      contents: read

  # A release needs a real cluster: five nodes built and checked end to end.
  # Look for an earlier green run of the same code first.
  proof:
    name: Earlier cluster test of the same code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find a green cluster test of the same code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            gh run list --workflow e2e.yml --status success --limit 30 \
              --json headSha,url --jq '.[] | "\(.headSha) \(.url)"'
            # Release runs ran the cluster test as their "e2e / ..." jobs.
            for id in $(gh run list --workflow release.yml --limit 15 --json databaseId --jq '.[].databaseId'); do
              gh run view "$id" --json headSha,url,jobs --jq '
                [.jobs[] | select(.name | startswith("e2e / "))] as $e2e
                | select(($e2e | length) > 0 and all($e2e[]; .conclusion == "success"))
                | "\(.headSha) \(.url)"'
            done
          } >"$RUNNER_TEMP/candidates"
          reuse=false
          while read -r sha url; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            if cli/tests/e2e/same-code.sh "$sha" "$GITHUB_SHA"; then
              echo "The cluster test of $sha passed on the same code: $url"
              echo "### Cluster test reused from $url" >>"$GITHUB_STEP_SUMMARY"
              reuse=true
              break
            fi
          done <"$RUNNER_TEMP/candidates"
          [ "$reuse" = true ] || echo "No earlier green run covers this code, so the cluster test runs."
          echo "reuse=$reuse" >>"$GITHUB_OUTPUT"

  e2e:
    needs: proof
    if: ${{ needs.proof.outputs.reuse != 'true' }}
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  release:
    name: Build, sign and publish
    needs: [tests, console-tests, proof, e2e]
    # The cluster test is skipped only when an earlier run of the same code passed.
    if: >-
      ${{ !cancelled() && needs.tests.result == 'success' && needs.console-tests.result == 'success' && needs.proof.result == 'success'
      && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.proof.outputs.reuse == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless Sigstore signing and the attestation
      attestations: write
    steps:
      # Third-party actions are pinned to a commit; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release only commits that are on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Check the tag matches the CLI version
        run: |
          version="$(sed -n 's/^version: *//p' cli/bashly.yml | tr -d '\r')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the CLI version v$version in cli/bashly.yml" >&2
            exit 1
          fi

      - name: Check the playbooks and the collection are this release
        run: |
          pinned="$(sed -n 's/^barekube_version: *//p' orchestration/ansible/roles/barekube/defaults/main.yml)"
          if [ "$pinned" != "$GITHUB_REF_NAME" ]; then
            echo "The playbook installs $pinned by default, not $GITHUB_REF_NAME (orchestration/ansible/roles/barekube/defaults/main.yml)" >&2
            exit 1
          fi
          collection="$(sed -n 's/^version: *//p' orchestration/ansible/galaxy.yml)"
          if [ "v$collection" != "$GITHUB_REF_NAME" ]; then
            echo "The collection is version $collection, not $GITHUB_REF_NAME (orchestration/ansible/galaxy.yml)" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the minimum (1.26.0). Build with the newest patch of 1.26: it has the
          # standard library security fixes that govulncheck looks for.
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: console/go.sum

      # The node-agent runs on every node, whatever its CPU: the same three
      # architectures the console image has. Static, so no libc on the node matters.
      - name: Build the node-agent
        working-directory: console
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p ../cli/release
          for arch in amd64 arm64 arm; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../cli/release/node-agent-linux-$arch" ./cmd/node-agent
          done

      # The shipped script is built here, from the tagged sources, with the
      # pinned bashly version - and must equal the committed copy.
      - name: Build the script
        working-directory: cli
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/app" \
            dannyben/bashly:1.2.13 generate
          git diff --exit-code -- release/barekube

      # The playbooks, as a download of their own (with play.sh) and as an
      # Ansible collection. Their checksums are separate files so SHA256SUMS
      # keeps listing only the CLI, which `barekube upgrade` checks.
      - name: Pack the playbooks
        run: orchestration/package.sh cli/release "$GITHUB_SHA"

      - name: Build the Ansible collection
        run: |
          pipx install ansible-core
          ansible-galaxy collection build orchestration/ansible --output-path cli/release

      - name: Checksum
        working-directory: cli/release
        run: |
          sha256sum barekube > SHA256SUMS
          sha256sum barekube-ansible.tar.gz > barekube-ansible.tar.gz.sha256
          collection="$(ls kostiantyn_matsebora-barekube-*.tar.gz)"
          sha256sum "$collection" > "$collection.sha256"
          # The node-agent's checksums are a file of their own, for the same reason.
          sha256sum node-agent-linux-* > node-agent.SHA256SUMS

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        working-directory: cli/release
        run: |
          cosign sign-blob --yes --bundle barekube.sigstore.json barekube
          cosign sign-blob --yes --bundle barekube-ansible.tar.gz.sigstore.json barekube-ansible.tar.gz
          collection="$(ls kostiantyn_matsebora-barekube-*.tar.gz)"
          cosign sign-blob --yes --bundle "$collection.sigstore.json" "$collection"
          for agent in node-agent-linux-*; do
            cosign sign-blob --yes --bundle "$agent.sigstore.json" "$agent"
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/release/barekube
            cli/release/barekube-ansible.tar.gz
            cli/release/kostiantyn_matsebora-barekube-*.tar.gz
            cli/release/node-agent-linux-*

      - name: Publish the release
        working-directory: cli/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" barekube SHA256SUMS barekube.sigstore.json \
            barekube-ansible.tar.gz barekube-ansible.tar.gz.sha256 barekube-ansible.tar.gz.sigstore.json \
            kostiantyn_matsebora-barekube-*.tar.gz kostiantyn_matsebora-barekube-*.tar.gz.sha256 \
            kostiantyn_matsebora-barekube-*.tar.gz.sigstore.json \
            node-agent-linux-amd64 node-agent-linux-arm64 node-agent-linux-arm node-agent.SHA256SUMS \
            node-agent-linux-amd64.sigstore.json node-agent-linux-arm64.sigstore.json node-agent-linux-arm.sigstore.json \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  # The same collection, on Ansible Galaxy. It runs only when the repository has
  # a GALAXY_API_KEY secret; the release above does not depend on it.
  galaxy:
    name: Publish the collection to Ansible Galaxy
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
    steps:
      - name: Say when there is no token
        if: ${{ env.GALAXY_API_KEY == '' }}
        run: echo "::notice::GALAXY_API_KEY is not set, so the collection was not published to Galaxy."

      - name: Publish
        if: ${{ env.GALAXY_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install ansible-core
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'kostiantyn_matsebora-barekube-*.tar.gz'
          ansible-galaxy collection publish kostiantyn_matsebora-barekube-*.tar.gz --token "$GALAXY_API_KEY"

  # The console as a Docker image, for the machine that runs it (the compose file
  # in console/deploy). It is published only after the release it belongs to.
  console-image:
    name: Build, sign and publish the console image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing and the attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/barekube-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: console
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=barekube console

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signed by digest, so the signature holds for every tag of the image.
      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Pulls the published image as a user would, checks its signature and runs
  # the compose file with it.
  verify-console-image:
    name: The published console image and compose file work
    needs: console-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: The signature comes from this release workflow
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${{ github.repository_owner }}/barekube-console:${{ github.ref_name }}" >/dev/null

      - name: Run it with the compose file of the release
        working-directory: console/deploy
        env:
          CONSOLE_VERSION: ${{ github.ref_name }}
        run: |
          ./generate-tokens.sh
          mkdir -p config/credentials
          cat >config/config.yaml <<'EOF'
          nodeAgent:
            mock: false
            credentialsDir: /secrets/node-agent
          listenAddr: ":8080"
          nodes:
            - name: master-1
              ip: 127.0.0.1
              role: master
              nodeAgentPort: 9091
              operations: [reboot, standby, rejoin, poweroff]
          EOF
          printf '%064d\n' 0 >config/credentials/master-1
          docker compose up -d
          ./check-running.sh http://localhost:8080 \
            "$(sed -n 's/^CONSOLE_UI_TOKEN=//p' .env)" "$(sed -n 's/^CONSOLE_NODE_TOKEN=//p' .env)" master-1 \
            || { docker compose logs; exit 1; }

  # Follows the README as a new user would: downloads the published release,
  # installs it, runs it and verifies its checksum and signature.
  verify-install:
    name: README instructions work on the published release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also lets the check run the cosign alternative from the README.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Run the installation and verification instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: cli/tests/readme_install.sh release "$GITHUB_REF_NAME"

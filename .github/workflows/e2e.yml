name: E2E cluster

# Builds a real five-node cluster (3 masters, 2 agents) with the barekube
# script of the commit under test, then runs smoke and end-to-end checks on it.
# Mandatory before a release (release.yml calls it), and run daily and on demand.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Run only the cluster jobs whose label matches this regular expression,
          e.g. "ansible.*full" or "galaxy". The label is
          "<provisioner> gvisor=<true|false> <inventory>[ console]". Empty runs all.
        required: false
        default: ""
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The matrix, optionally narrowed with the "only" input of a manual run, so a
  # fix can be tried on just the jobs that failed.
  matrix:
    name: Choose the cluster jobs
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all='[
            {"provisioner":"script","gvisor_default":false,"console":true},
            {"provisioner":"script","gvisor_default":true},
            {"provisioner":"ansible","gvisor_default":false,"inventory":"minimal"},
            {"provisioner":"ansible","gvisor_default":false,"inventory":"full","console":true},
            {"provisioner":"ansible","gvisor_default":true,"inventory":"full"},
            {"provisioner":"galaxy","gvisor_default":false,"inventory":"minimal"},
            {"provisioner":"galaxy","gvisor_default":false,"inventory":"full"}
          ]'
          picked="$(jq -c --arg only "$ONLY" '
            map(select(("\(.provisioner) gvisor=\(.gvisor_default) \(.inventory // "")\(if .console then " console" else "" end)") | test($only)))' <<<"$all")"
          [[ "$picked" != "[]" ]] || { echo "::error::nothing matches '$ONLY'"; exit 1; }
          echo "include=$picked" >>"$GITHUB_OUTPUT"

  cluster:
    name: Five-node cluster (${{ matrix.provisioner }}, gVisor default ${{ matrix.gvisor_default }}${{ matrix.inventory && format(', {0} inventory', matrix.inventory) || '' }}${{ matrix.console && ', with the console' || '' }})
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The cluster is built by the barekube commands run one node at a time
        # ("script"), by the Ansible playbooks from the release archive
        # ("ansible", through play.sh in Docker) and by the Ansible collection
        # ("galaxy", built from the commit and run with ansible-playbook), with
        # and without gVisor as the default for pods. The Ansible ones run with
        # an inventory that has only the required settings ("minimal": every
        # default applies) and with one that defines every setting, optional
        # ones included ("full"). The list is in the job above.
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      E2E_PROVISIONER: ${{ matrix.provisioner }}
      E2E_GVISOR_DEFAULT: ${{ matrix.gvisor_default }}
      E2E_INVENTORY: ${{ matrix.inventory }}
      # The optional console and the node-agents of four of the five nodes.
      E2E_CONSOLE: ${{ matrix.console }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The nodes are LXD system containers: full systemd machines with their
      # own addresses, so barekube runs on them exactly as on bare metal.
      - name: Set up LXD
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          # Docker's firewall rules drop forwarded packets, which would cut the
          # containers off from the network.
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true
          sudo modprobe -a overlay br_netfilter ip_tables ip6_tables nf_nat
          lxc profile create barekube-e2e
          lxc profile edit barekube-e2e <cli/tests/e2e/profile.yaml

      - name: Install Ansible
        if: matrix.provisioner == 'galaxy'
        run: pipx install --include-deps "$(grep -h ansible-core orchestration/ansible/requirements.txt)"

      - name: Check the runner kernel has WireGuard
        run: sudo modprobe wireguard

      - name: Build the cluster
        run: cli/tests/e2e/provision.sh

      # Builds the console and the node-agent from this commit, installs the
      # agents (with the CLI or the playbook, like the cluster) and starts the
      # console on the runner. Does nothing in the jobs without the console.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.console
        with:
          go-version-file: console/go.mod
          cache-dependency-path: console/go.sum

      - name: Add the console
        if: matrix.console
        run: cli/tests/e2e/console.sh

      - name: Smoke and end-to-end checks
        run: cli/tests/e2e/smoke.sh

      - name: Diagnostics
        if: failure()
        run: cli/tests/e2e/diagnose.sh

name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or goal, before the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The behaviour you would like to see.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

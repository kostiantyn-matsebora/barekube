<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>barekube console — sign in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%232f9fd0%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M16%203%2028%209.5v13L16%2029%204%2022.5v-13z%22/%3E%3Cpath%20d%3D%22M4%209.5%2016%2016l12-6.5M16%2016v13%22/%3E%3Cpath%20d%3D%22M16%2016%2028%209.5v13L16%2029z%22%20fill%3D%22%232f9fd0%22%20stroke%3D%22none%22%20opacity%3D%22.9%22/%3E%3C/svg%3E">
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; display: flex;
           height: 100vh; align-items: center; justify-content: center; margin: 0; }
    form { background: #1a1d24; padding: 2rem; border-radius: 8px; min-width: 280px; }
    input { display: block; width: 100%; margin-bottom: 1rem; padding: .5rem; box-sizing: border-box;
            background: #0f1115; color: #e6e6e6; border: 1px solid #333; border-radius: 4px; }
    button { width: 100%; padding: .6rem; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: #f87171; margin-bottom: 1rem; }
    h1 { font-size: 1.1rem; margin-top: 0; display: flex; align-items: center; gap: .6rem; font-weight: 500; color: #9aa4b2; }
    h1 span { color: #e6e6e6; font-weight: 700; }
    .logo { width: 30px; height: 30px; flex: none; color: #e6e6e6; --acc: #3b82f6; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M16 3 28 9.5v13L16 29 4 22.5v-13z"/><path d="M4 9.5 16 16l12-6.5M16 16v13"/><path d="M16 16 28 9.5v13L16 29z" fill="var(--acc,#3b82f6)" stroke="none" opacity=".9"/></svg><span>barekube</span> console</h1>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <input type="password" name="token" placeholder="access token" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
